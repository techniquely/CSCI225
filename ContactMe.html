        <div class="row g-4 align-items-start">
            
            
            <div class="col-lg-6">
                <div class="card shadow-sm p-3 mb-4 border rounded-3 bg-white">
                    <div class="ratio ratio-16x9 border rounded overflow-hidden">
                        <iframe src="https://www.youtube.com/embed/Z10iWqkOlW4?list=RDZ10iWqkOlW4" title="Embedded Video" allowfullscreen></iframe>
                    </div>
                </div>

                
                <div class="card shadow-sm p-4 border rounded-3 bg-white">
                    <h5 class="mb-3">Quick Preferences</h5>
                    <div class="mb-3">
                        <label for="favColor" class="form-label">What's your favorite color?</label>
                        <input type="color" id="favColor" name="favColor" class="form-control form-control-color">
                    </div>
                    <div class="mb-3">
                        <label for="dateVisited" class="form-label">Date Visited:</label>
                        <input type="date" id="dateVisited" name="dateVisited" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label for="phone" class="form-label">Telephone:</label>
                        <input type="tel" id="phone" name="phone" class="form-control" placeholder="XXX-XXX-XXXX">
                    </div>
                </div>
            </div>

            
            <div class="col-lg-6">
                <div class="card shadow-sm p-4 border rounded-3 bg-white">
                    <h2 class="h4 mb-3">Feedback Form</h2>
                    
                    <form action="submit_feedback.php" name="Feedback" method="post">
                        
                        
                        <div class="form-floating mb-3">
                            <input type="text" name="fname" class="form-control" id="fname" placeholder="First Name">
                            <label for="fname">First Name*</label>
                        </div>

                       
                        <div class="form-floating mb-3">
                            <input type="text" name="lname" class="form-control" id="lname" placeholder="Last Name">
                            <label for="lname">Last Name*</label>
                        </div>

                        
                        <div class="mb-3">
                            <label for="mail" class="form-label">Email Address:</label>
                            <input type="email" id="mail" name="mail" class="form-control" placeholder="name@domain.com">
                            <small id="emailHelpBlock" class="form-text text-muted">Your email will not be shared with anyone else.</small>
                        </div>

                       
                        <div class="mb-3">
                            <label class="form-label d-block">Would you recommend this website?</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="recommend" id="recYes" value="yes">
                                <label class="form-check-label" for="recYes">Yes</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="recommend" id="recNo" value="no">
                                <label class="form-check-label" for="recNo">No</label>
                            </div>
                        </div>

                       
                        <div class="mb-3">
                            <label for="favorite" class="form-label">Preferred Site:</label>
                            <select name="favorite" id="favorite" class="form-select">
                                <option value="Google">Google</option>
                                <option value="Facebook">Facebook</option>
                                <option value="Twitter">Twitter</option>
                                <option value="Reddit">Reddit</option>
                            </select>
                        </div>

                        
                        <div class="mb-3">
                            <label for="rating" class="form-label">Rate this website (1-10):</label>
                            <input type="range" class="form-range" name="rating" min="1" max="10" id="rating">
                        </div>

                        
                        <div class="mb-3">
                            <label for="comment" class="form-label">Any additional comments:</label>
                            <textarea class="form-control" name="comment" id="comment" rows="3" placeholder="I suggest..."></textarea>
                        </div>

                        
                        <button type="submit" class="btn btn-primary w-100">Submit</button>
                    </form>
                </div>
            </div>

        </div>
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
