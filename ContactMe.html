<!DOCTYPE html>
<html lang="en">
<head>
    <title>Contact Me</title>
</head>
<body>
<hr>
<h1>Contact Me</h1>
<hr> 
<!--Embedded Video-->
<iframe width="640" height="360" src="https://www.youtube.com/embed/Z10iWqkOlW4?list=RDZ10iWqkOlW4" allowfullscreen></iframe>

<!--Feedback Form-->
<form name="feedback">
    <label> First Name: </label>
    <input type="text" name="fname" placeholder="anonymous" required><br><br>

    <label> Last Name: </label>
    <input type="text" name="lname" placeholder="anonymous" required><br><br>

    <label> Email: </label>
    <input type="text" name="mail" placeholder="name@domain.com"><br><br>

    <label> Would you recommend this website?</label><br>
    <input type="radio" name="recommend" value="yes"> Yes 
    <input type="radio" name="recommend" value="no"> No<br>

    <label> Favorite Website: </label>
    <select name="favorite">
        <option value="Google">Google</option>
        <option value="Facebook">Facebook</option>
        <option value="Twitter">Twitter</option>
        <option value="Reddit">Reddit</option>

    </select><br>

    <label> Rate this website (1-10): </label>
    <input type="range" name="rating" min="1" max="10"><br>

    <label>Any additional comments: </label>
    <textarea name="comment"></textarea><br>

    <label for="favColor">What's your favorite color?</label>
    <input type="color" id="favColor" name="favColor">


    <label for="dateVisited">Date Visited:</label>
    <input type="date" id="dateVisited" name="dateVisited">

    <label for="phone">Telephone:</label>
    <input type="tel" id="phone" name="phone" placeholder="XXX-XXX-XXXX">

    <button type="submit">Submit</button>

</form>



</body>
</html>
