<!DOCTYPE html>
<html>
<head>
    <hr>
    <title>Contact Me</title>
    <hr>
</head>
<body>

<h1>Contact Me</h1>

<!--Embedded Video-->

<iframe width="640" height="360" src="https://www.youtube.com/embed/Z10iWqkOlW4?list=RDZ10iWqkOlW4" title="Hello, World - Louie Zong | Animated Music Video" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
<!--Feedback Form-->
<form name="feedback">
    <label>First Name: </label>
    <input type="text" name="fname" placeholder="anonymous" required><br><br>

    <label>Last Name: </label>
    <input type="text" name="lname" placeholder="anonymous" required><br><br>

    <label>Email: </label>
    <input type="text" name="mail" placeholder="name@domain.com"><br><br>

    <label>Would you recommend this website?</label><br>
    <input type="radio" name="recommend" value="yes"> Yes 
    <input type="radio" name="recommend" value="no"> No<br>>

    <label>Favorite Website: </label>
    <select name="favorite">
        <option value="Google">Google</option>
        <option value="Facebook">Facebook</option>
        <option value="Twitter">Twitter</option>
        <option value="Reddit">Reddit</option>

    </select>

    <label>Rate this website (1-10): </label>
    <input type="range" name="rating" min="1" max="10">

    <label>Any additional comments: </label>
    <textarea name="comment"></textarea>


</form>


</body>
</html>
